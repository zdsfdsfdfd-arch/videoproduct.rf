<svg xmlns="http://www.w3.org/2000/svg" viewBox="76 103 615 470">
  <!--
    Видеопродакшн.РФ — the studio's mark, rebuilt from the brand file they supplied:
    an open play triangle, a ring (not a disc) and three corner brackets of the frame that
    fade out. Geometry, colours and gradients match the original; the grey gradients end at
    #FFFFFF with zero opacity so the brackets fade out on dark backgrounds too, instead of
    turning into white hooks.
  -->
  <defs>
    <linearGradient id="vpRing" x1="528" y1="130" x2="528" y2="406" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0035F4" /><stop offset="1" stop-color="#000077" />
    </linearGradient>
    <linearGradient id="vpPlay" x1="41" y1="521" x2="269" y2="297" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7C0000" /><stop offset="1" stop-color="#E80000" />
    </linearGradient>
    <linearGradient id="vpFrame1" x1="221" y1="297" x2="346" y2="297" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#B7B9BA" /><stop offset="1" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="vpFrame2" x1="221" y1="520" x2="344" y2="520" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#B7B9BA" /><stop offset="1" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="vpFrame3" x1="429" y1="512" x2="554" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#B7B9BA" /><stop offset="1" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
  </defs>

  <g fill="none" stroke-width="42.7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M242.8,330.4V263.5H324.9" stroke="url(#vpFrame1)" />
    <path d="M322.9,552.7H242.8V487" stroke="url(#vpFrame2)" />
    <path d="M532.9,471.2V552.6H450.2" stroke="url(#vpFrame3)" />
  </g>

  <circle cx="528.3" cy="267.8" r="137.6" fill="none" stroke="url(#vpRing)" stroke-width="53" />
  <path d="M105,268.7V545L344.1,406.7Z" fill="none" stroke="url(#vpPlay)" stroke-width="56" stroke-linejoin="round" />
</svg>
