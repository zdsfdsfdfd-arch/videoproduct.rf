# Builds site/ and publishes it to GitHub Pages on every push to the branch Pages is bound to.
# The site lives at https://<owner>.github.io/<repo>/, so Vite gets that sub-path as base
# and 404.html is a copy of index.html so client-side routes survive a direct load / refresh.
name: Deploy to GitHub Pages

on:
  push:
    # Only feat/site. GitHub Pages only accepts a deployment from the repository's default
    # branch, which is feat/site here; a run started by the mirror push to main builds fine but
    # fails at the deploy step — and, sharing the `pages` concurrency group, it cancelled the
    # real deploy on its way down. (If the default branch is ever switched to main, add it back.)
    branches: [feat/site]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - id: deployment
        uses: actions/deploy-pages@v4
